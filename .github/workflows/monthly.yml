   name: データセット一覧の更新

   on:
     schedule:
       - cron: "0 1 1 * *"      # 毎月1日 10:00 日本時間
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: 一覧を生成
           env:
             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: python3 datasets_csv.py
         - name: CSVを保存
           run: |
             git config user.name "dataset-bot"
             git config user.email "dataset-bot@users.noreply.github.com"
             git add output
             git diff --cached --quiet || git commit -m "datasets: $(date -u +%Y-%m-%d)"
             git push
